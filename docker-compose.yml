services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: movieapp
      POSTGRES_PASSWORD: movieapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieapp -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      MODEL_DIR: /app/models
      DATABASE_URL: postgresql+psycopg://movieapp:movieapp@db:5432/moviedb
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      JWT_SECRET: change-this-before-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
